<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#150a12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CALL DJ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>CALL DJ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
html{background:#150a12}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: call cards and the SFX pad grid scroll; the mixer and transport sit in a dock that is always on screen (bottom on phones, right panel on PC) */
:root{
  --bg:#150a12;
  --surface:#22121d;
  --surface-2:#2e1927;
  --line:#4a2b3d;
  --fg:#f6ece4;
  --muted:#b59aa8;
  --gold:#e8c37a;
  --gold-deep:#b98b3e;
  --rose:#e2577e;
  --bass:#9d7bff;
  --ok:#7fd6a4;
  --font-display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--dock-h,260px) + 16px);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#fizz{position:fixed;inset:0;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:28px;padding-top:20px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,7vw,40px);line-height:1.1;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 span{color:var(--gold)}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip.cloud{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.chip.cloud::before{background:var(--ok)}
.chip.view{color:var(--gold)}
.chip.view::before{background:var(--gold)}
.meter{width:120px;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold-deep),var(--gold),var(--rose))}
h2{font-family:var(--font-display);font-weight:400;font-size:18px;margin:0;letter-spacing:.04em}
.label{font-size:11px;letter-spacing:.14em;color:var(--muted)}
section{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible,label.btn:focus-within,.fader:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:42px;padding:0 14px;border-radius:10px;
  background:var(--surface-2);border:1px solid var(--line);font-weight:700;font-size:14px;cursor:pointer;user-select:none;white-space:nowrap}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn:active{transform:scale(.97)}
.btn.gold{background:var(--gold);color:#2a1508;border-color:var(--gold)}
.btn.live{background:var(--rose);border-color:var(--rose);color:#fff}
.btn.on{border-color:var(--gold);color:var(--gold)}
.btn.danger{color:var(--rose);border-color:var(--rose)}
.btn.danger.arm{background:var(--rose);color:#fff}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;grid-column:1/-1}
.rename{width:100%;min-width:0;font:inherit;font-weight:700;color:var(--fg);background:var(--bg);border:1px solid var(--gold-deep);border-radius:8px;padding:6px 8px;font-size:14px}
/* Call cards */
.calls{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:720px){.calls{grid-template-columns:repeat(2,minmax(0,1fr))}}
.call{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.call.live{border-color:var(--gold-deep)}
.call-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;min-width:0}
.call-name{font-family:var(--font-display);font-weight:400;font-size:19px;margin:0;line-height:1.3;min-width:0;overflow-wrap:anywhere}
.call.live .call-name{color:var(--gold)}
.call-head .rename{flex:1 1 160px;font-size:16px;padding:8px 10px}
.trks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trk{position:relative;min-height:92px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(160deg,var(--surface-2),var(--surface));
  display:flex;flex-direction:column;justify-content:space-between;gap:4px;padding:10px;text-align:left;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;min-width:0;transition:transform .06s}
button.trk:active{transform:scale(.96)}
.trk .tl{font-family:var(--font-display);font-size:15px;letter-spacing:.04em}
.trk .tl b{font-weight:400;font-size:22px;margin-left:2px}
.trk .fn{font-size:12px;color:var(--fg);opacity:.75;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.trk .dur{font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.trk.playing{border-color:var(--gold);background:linear-gradient(160deg,#4a3018,#2a170f)}
.trk.playing .tl{color:var(--gold)}
.trk.missing{opacity:.5}
.trk .tn{font-family:var(--font-display);font-size:15px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-all}
.trk.playing .tn{color:var(--gold)}
.trk.playing .dur{color:var(--gold)}
.mvrow{display:flex;gap:6px}
.mv{flex:1;min-height:34px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--fg)}
.mv:disabled{opacity:.3;cursor:default}
.call-head .mv{flex:0 0 38px;min-height:36px}
.field{flex:1 1 200px;min-width:0;min-height:42px;font:inherit;color:var(--fg);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.editing .trk{min-height:132px}
.trk .tw{display:block;width:100%;height:24px}
/* SFX pads */
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.pads{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pad{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:16px;border:1px solid var(--line);background:radial-gradient(120% 90% at 30% 20%,var(--surface-2),var(--surface));
  display:flex;flex-direction:column;justify-content:space-between;gap:8px;padding:14px;text-align:left;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;min-width:0;transition:transform .06s,border-color .2s}
button.pad:active{transform:scale(.96)}
.pad .nm{font-family:var(--font-display);font-size:clamp(15px,4.2vw,19px);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;word-break:break-all}
.meta{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pad.active{border-color:var(--gold)}
.pad.hit{animation:hit .45s ease-out}
@keyframes hit{0%{box-shadow:0 0 0 0 var(--gold),inset 0 0 44px var(--gold)}100%{box-shadow:0 0 0 14px transparent,inset 0 0 0 transparent}}
.del{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--rose);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2}
.editing .trk,.editing .pad{border-style:dashed}
.editing .trk{padding-top:12px}
/* Mixer */
.mixer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fader{display:flex;flex-direction:column;align-items:center;gap:4px;touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;min-width:0;border-radius:10px}
.fv{font-family:var(--font-mono);font-size:12px;color:var(--gold);font-variant-numeric:tabular-nums;min-height:1.4em}
.fader[data-k=bass] .fv{color:var(--bass)}
.rail{position:relative;width:56px;max-width:100%;height:var(--rail-h,92px);border-radius:14px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.rail .fill{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(0deg,var(--gold-deep),var(--gold));opacity:.85}
.fader[data-k=bass] .fill{background:linear-gradient(0deg,#5b3fc4,var(--bass))}
.rail .zero{position:absolute;left:6px;right:6px;top:50%;height:2px;background:var(--line)}
.rail .thumb{position:absolute;left:4px;right:4px;height:14px;border-radius:7px;background:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.5);transform:translateY(50%)}
.fl{font-weight:700;font-size:12px;text-align:center}
.mix-note{grid-column:1/-1;color:var(--muted);font-size:12px;text-align:center;margin:4px 0 0;display:none}
.hint{color:var(--muted);font-size:12px;margin:0}
.ver{color:var(--muted);font-size:11px;font-family:var(--font-mono);margin:0;opacity:.7}
/* Dock: mixer + transport, always on screen. Phone: bottom sheet. PC: right-hand panel. */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dock .in{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.dock-head{display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:28px}
.dock-head h2{font-size:14px}
.mixToggle{min-height:28px;padding:0 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
.dock.min .mixer{display:none}
.np{display:flex;flex-direction:column;gap:4px;min-width:0}
.np-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;min-width:0}
.np-name{font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;color:var(--gold)}
.np-time{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.np-time.soon{color:var(--rose);font-weight:700}
.np-wave{display:block;width:100%;height:44px;border-radius:8px;background:var(--surface);touch-action:none;cursor:pointer}
.dock-act{display:flex;gap:6px;align-items:center}
.syncMini{min-height:28px;padding:0 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--ok) 50%,var(--line));font-size:12px;font-weight:700;color:var(--ok)}
.syncMini.warn,#syncBtn.warn{background:var(--rose);border-color:var(--rose);color:#fff}
.syncMini:disabled,#syncBtn:disabled{opacity:.6}
.transport{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.transport .btn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;min-height:44px;padding:0 8px;min-width:0}
.transport #pauseBtn:disabled{opacity:.45;cursor:default}
#modeBtn{flex-direction:column;gap:0;line-height:1.15}
#modeBtn small{font-size:10px;font-weight:700;color:var(--muted)}
@media (min-width:900px){
  body{padding-right:calc(330px + max(16px,env(safe-area-inset-right,0px)));padding-block:0 32px}
  .dock{left:auto;top:0;width:330px;border-top:none;border-left:1px solid var(--line);
    padding-top:calc(20px + env(safe-area-inset-top,0px));padding-left:16px}
  .dock{overflow-y:auto}
  .dock .in{min-height:100%;gap:14px}
  .dock .mixer{display:grid!important;flex:1 1 auto;min-height:220px;grid-template-rows:minmax(0,1fr) auto;padding-top:4px}
  .dock .fader{height:100%;min-height:0}
  .dock .rail{flex:1 1 auto;height:auto;min-height:120px;max-height:420px}
  .dock-head h2{font-size:18px}
  .mixToggle{display:none}
  .mix-note{display:block}
  .np-wave{height:72px}
  .transport .btn{font-size:14px;min-height:46px}
}
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,4,8,.72);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px}
.sheet .field{flex:none}
.sheet .ctrls{justify-content:flex-end}
.pw-err{color:var(--rose);font-weight:700}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--gold);color:#2a1508;font-weight:700;
  padding:8px 16px;border-radius:999px;z-index:9;font-size:14px;transition:opacity .3s;opacity:0;pointer-events:none;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.pad.hit{animation:none}}
</style>
</head>
<body>

<canvas id="fizz"></canvas>
<div class="toast" id="toast"></div>
<input type="file" id="addTrackFile" accept="audio/*,audio/mpeg,audio/mp3,audio/mp4,audio/x-m4a,audio/aac,audio/wav,audio/x-wav,video/mp4,.mp3,.m4a,.mp4,.aac,.wav,.aif,.aiff,.caf" multiple hidden>
<main>
  <header>
    <div>
      <h1><span>CALL</span> DJ</h1>
    </div>
    <div class="hright">
      <button class="btn sm gold" id="installBtn" hidden>アプリとしてインストール</button>
      <div class="meter" aria-label="出力レベル"><i id="lvl"></i></div>
    </div>
  </header>
  <p class="hint" id="iosHint" hidden>iPhoneでアプリにするには、Safariの共有ボタン →「ホーム画面に追加」を押してください。</p>

  <section aria-labelledby="h-call">
    <div class="sec-head">
      <h2 id="h-call">コール</h2>
      <div class="ctrls">
        <button class="btn editBtn canEdit" aria-pressed="false">編集</button>
      </div>
    </div>
    <div class="ctrls canEdit">
      <label class="btn gold" for="callFile">＋ コールを追加</label>
      <input type="file" id="callFile" accept="audio/*,audio/mpeg,audio/mp3,audio/mp4,audio/x-m4a,audio/aac,audio/wav,audio/x-wav,video/mp4,.mp3,.m4a,.mp4,.aac,.wav,.aif,.aiff,.caf" multiple hidden>
      <label class="btn" for="callDir">フォルダからまとめて</label>
      <input type="file" id="callDir" webkitdirectory multiple hidden>
    </div>
    <div class="calls" id="calls"></div>
    <p class="hint canEdit">「＋ コールを追加」で曲のファイルを2〜3個まとめて選ぶと、1つのコールになります。「編集」で名前の変更と、◀ ▶ で曲の順番の入れ替えができます。</p>
  </section>

  <section aria-labelledby="h-sfx">
    <div class="sec-head">
      <h2 id="h-sfx">効果音</h2>
      <div class="ctrls">
        <button class="btn editBtn canEdit" aria-pressed="false">編集</button>
        <label class="btn gold canEdit" for="sfxFile">＋ 取り込む</label>
        <input type="file" id="sfxFile" accept="audio/*,audio/mpeg,audio/mp3,audio/mp4,audio/x-m4a,audio/aac,audio/wav,audio/x-wav,video/mp4,.mp3,.m4a,.mp4,.aac,.wav,.aif,.aiff,.caf" multiple hidden>
      </div>
    </div>
    <div class="pads" id="pads"></div>
    <p class="hint">連打で重ねて鳴らせます。PCはキー 1〜9 でも鳴ります。</p>
  </section>

  <section aria-labelledby="h-sync">
    <div class="sec-head"><h2 id="h-sync">同期</h2><span class="chip" id="saveChip">確認中</span></div>
    <p class="hint" id="syncNote"></p>
    <div class="ctrls" id="syncCtrls" hidden>
      <button class="btn gold" id="syncBtn">最新に更新</button>
    </div>
  </section>

  <p class="ver" id="ver">CALL DJ v15</p>
</main>

<div class="modal" id="pwModal" hidden>
  <form class="sheet" id="pwForm" autocomplete="off">
    <h2>変更を送信</h2>
    <p class="hint" id="pwInfo"></p>
    <input class="field" type="password" id="pwInput" placeholder="お店の同期パスワード" aria-label="同期パスワード" autocomplete="off">
    <p class="hint pw-err" id="pwErr" hidden></p>
    <div class="ctrls"><button type="button" class="btn" id="pwCancel">キャンセル</button><button type="submit" class="btn gold" id="pwSend">送信</button></div>
  </form>
</div>

<aside class="dock" id="dock" aria-label="ミキサー">
  <div class="in">
    <div class="dock-head"><h2>ミキサー</h2><div class="dock-act"><button class="syncMini" id="syncMini" hidden>同期</button><button class="mixToggle" id="mixToggle" aria-expanded="true">たたむ ▾</button></div></div>
    <div class="np" id="np">
      <div class="np-top"><span class="np-name" id="npName">再生していません</span><span class="np-time" id="npTime"></span></div>
      <canvas class="np-wave" id="npWave" aria-label="再生中の曲の波形。タップした位置へ移動します"></canvas>
    </div>
    <div class="mixer" id="mixer"></div>
    <div class="transport">
      <button class="btn gold" id="pauseBtn" disabled>⏸ 一時停止</button>
      <button class="btn live" id="stopAll">■ 全停止</button>
      <button class="btn" id="modeBtn"></button>
      <button class="btn" id="fadeBtn">フェードアウト</button>
    </div>
  </div>
</aside>

<script>
(() => {
const $ = id => document.getElementById(id);
// ---------- audio engine ----------
// iPhone stops a page's audio when the app goes to the background and does not always bring it back.
// So on iPhone, the first touch after coming back builds a fresh audio engine.
const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const AC = window.AudioContext || window.webkitAudioContext;
const setSession = () => { try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {} };
setSession();
let ctx, bass, master, lim, analyser, callBus, sfxBus, staleAudio = false;
function buildAudio() {
  ctx = new AC();
  bass = ctx.createBiquadFilter(); bass.type = 'lowshelf'; bass.frequency.value = 110;
  master = ctx.createGain();
  lim = ctx.createDynamicsCompressor(); lim.threshold.value = -1; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .1;
  analyser = ctx.createAnalyser(); analyser.fftSize = 512;
  bass.connect(master); master.connect(lim); lim.connect(analyser); analyser.connect(ctx.destination);
  callBus = ctx.createGain(); callBus.connect(bass);
  sfxBus = ctx.createGain(); sfxBus.connect(bass);
}
buildAudio();
function rebuildAudio() {
  const old = ctx;
  // keep the song that was playing: move it onto the new engine, paused at the same spot
  if (cur) {
    const p = cur, pos = p.a.currentTime || 0, src = p.a.src, loop = p.a.loop, onend = p.a.onended;
    try { p.a.pause(); p.node.disconnect(); } catch (e) {}
    buildAudio();
    const a = new Audio(); a.preload = 'auto'; a.src = src; a.loop = loop; a.onended = onend;
    a.addEventListener('loadedmetadata', () => { try { a.currentTime = pos; } catch (e) {} }, { once: true });
    const node = ctx.createMediaElementSource(a), g = ctx.createGain(); node.connect(g); g.connect(callBus);
    Object.assign(p, { a, node, g, paused: true });
    npId = null;
  } else buildAudio();
  liveEls.forEach(a => { try { a.pause(); } catch (e) {} }); liveEls.clear(); voices.clear();
  FADERS.forEach(f => apply(f.k));

{
